# Agentic UAV System Configuration
perception_node:
  ros__parameters:
    yolo_model: "yolo11n.pt"
    confidence_threshold: 0.35
    target_frame: "map"
    camera_topic: "/camera/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/camera_info"
    odom_topic: "/uav/odometry"
    publish_rate_hz: 10.0

reasoning_node:
  ros__parameters:
    gemini_model: "gemini-2.5-flash"
    default_mission_goal: "Conduct search and rescue reconnaissance over Sector Alpha: identify survivors, locate thermal hazards, and verify clear landing zones."
    cognitive_cycle_rate_hz: 0.5
    auto_cycle_enabled: false

action_node:
  ros__parameters:
    takeoff_altitude: 4.0
    max_flight_speed: 4.0
    geofence_radius: 150.0
    geofence_max_alt: 25.0
    stream_rate_hz: 20.0

mcp_integration_node:
  ros__parameters:
    allowed_tokens:
      - "uav_reasoning_node_auth_token"
      - "admin_secret_token"

learning_node:
  ros__parameters:
    embedding_dim: 128
