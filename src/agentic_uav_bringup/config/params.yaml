action_node:
  ros__parameters:
    takeoff_altitude: 4.0
    acceptance_radius: 0.5
    geofence_radius: 150.0
    geofence_max_alt: 25.0
    min_nav_altitude: 1.0
    rate_hz: 20.0
    nav_timeout_s: 120.0
    # PX4 versions some topic names; confirm with `ros2 topic list | grep fmu/out`.
    px4.status_topic: /fmu/out/vehicle_status_v1
    px4.local_position_topic: /fmu/out/vehicle_local_position
    px4.battery_topic: /fmu/out/battery_status

perception_node:
  ros__parameters:
    detector: color   # HSV blobs matched to the search_and_rescue world; or none
    rate_hz: 5.0
    # Camera on the body (FLU, m) and its downward pitch (rad). The pitch must match
    # CAMERA_PITCH_RAD in compose.yaml, which the sim applies to the x500_depth model.
    camera.mount_xyz: [0.132, 0.0, 0.261]
    camera.mount_pitch: 0.785
    px4.local_position_topic: /fmu/out/vehicle_local_position
    px4.attitude_topic: /fmu/out/vehicle_attitude

reasoning_node:
  ros__parameters:
    llm.provider: gemini
    llm.model: gemini-2.5-flash
    max_steps: 20
    service_timeout_s: 10.0
    nav_timeout_s: 180.0

learning_node:
  ros__parameters:
    store_path: /data/memory.jsonl
    embedder: sentence-transformers
