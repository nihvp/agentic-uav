action_node:
  ros__parameters:
    takeoff_altitude: 4.0
    acceptance_radius: 0.5
    geofence_radius: 150.0
    geofence_max_alt: 25.0
    min_nav_altitude: 1.0
    rate_hz: 20.0
    nav_timeout_s: 120.0
    # PX4 versions some topic names; confirm with `ros2 topic list | grep fmu/out`.
    px4.status_topic: /fmu/out/vehicle_status_v1
    px4.local_position_topic: /fmu/out/vehicle_local_position
    px4.battery_topic: /fmu/out/battery_status

perception_node:
  ros__parameters:
    detector: color   # HSV blobs matched to the search_and_rescue world; or none
    rate_hz: 5.0
    # Camera on the body (FLU, m) and its downward pitch (rad). The pitch must match
    # CAMERA_PITCH_RAD in compose.yaml, which the sim applies to the x500_depth model.
    camera.mount_xyz: [0.132, 0.0, 0.261]
    camera.mount_pitch: 0.785
    px4.local_position_topic: /fmu/out/vehicle_local_position
    px4.attitude_topic: /fmu/out/vehicle_attitude
    # Skip frames while turning faster than this (rad/s): image lag would rotate detections.
    max_yaw_rate: 0.15

reasoning_node:
  ros__parameters:
    # ollama (local llm service, OpenAI-compatible API) | vllm | openai_compat | gemini
    llm.provider: ollama
    llm.base_url: http://127.0.0.1:11434/v1
    # For ollama/vllm the LLM_MODEL env var (compose, from .env) overrides this.
    llm.model: qwen3:14b
    # -1 = server/model default.
    llm.temperature: -1.0
    # Sent as reasoning_effort. Ollama: "none" turns thinking off; any other level turns
    # it on; "" = model default (qwen3: on). Off, qwen3:14b answered in ~2 s but planned
    # nothing (reached the survivor 5 times without finishing); on, 25-40 s per step.
    llm.reasoning_effort: ""
    # A local 14B model answers in a few seconds; the first request also loads it into VRAM.
    llm.timeout_s: 180.0
    # Context window for the prompt-size warning; -1 = LLM_CONTEXT env (ollama/vllm), 0 = none.
    llm.context_tokens: -1
    # Gemini only (llm.provider: gemini, model e.g. gemini-3.5-flash). Free tier = 5 rpm.
    llm.requests_per_minute: 0.0
    llm.thinking_level: low
    # LLM turns per mission (scan is one tool call; a turn can call several tools).
    max_steps: 40
    service_timeout_s: 10.0
    nav_timeout_s: 180.0
    trace_dir: /data/missions

learning_node:
  ros__parameters:
    store_path: /data/memory.jsonl
    embedder: sentence-transformers
