# NVIDIA GPU for every service. Added by scripts/run.sh when Docker has the NVIDIA
# runtime (NVIDIA Container Toolkit); without it the stack runs on CPU / software GL.
x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  sim:
    <<: *nvidia
    environment:
      # "graphics" makes the toolkit mount the NVIDIA GL/EGL libraries for Gazebo.
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
  agent:
    <<: *nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
  llm:
    <<: *nvidia
