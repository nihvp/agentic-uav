name: agentic-uav

x-host: &host
  network_mode: host
  ipc: host
  shm_size: 2gb

services:
  sim:
    <<: *host
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    image: agentic-uav/sim:px4-1.16
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HEADLESS: ${HEADLESS:-}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-0}
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-search_and_rescue}
      PX4_SIM_MODEL: gz_x500_depth
      GZ_IP: 127.0.0.1
      # gz-transport only connects processes in the same partition; the default is
      # "<hostname>:<user>", and the two containers run as different users.
      GZ_PARTITION: agentic_uav
      # docker/sim_entrypoint.sh applies PX4_PARAM_<NAME> at PX4 startup.
      # No ground station: allow arming without one and skip RC-loss failsafe in offboard.
      PX4_PARAM_NAV_DLL_ACT: 0
      PX4_PARAM_COM_RCL_EXCEPT: 4
      # docker/sim_entrypoint.sh patches the x500_depth camera: pitch it down so it sees
      # the ground below, and render RGB smaller/slower to save CPU and memory.
      # Keep CAMERA_PITCH_RAD equal to perception_node camera.mount_pitch in params.yaml.
      CAMERA_PITCH_RAD: 0.785
      CAMERA_WIDTH: 640
      CAMERA_HEIGHT: 360
      CAMERA_RATE_HZ: 10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src/agentic_uav_bringup/worlds:/worlds:ro,z
      # Mounted so entrypoint changes apply without rebuilding the image.
      - ./docker/sim_entrypoint.sh:/usr/local/bin/sim_entrypoint.sh:ro,z
    stdin_open: true
    tty: true

  agent:
    <<: *host
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: agentic-uav/agent:jazzy
    depends_on: [sim]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # Must match the sim container so ros_gz_bridge discovers Gazebo topics.
      GZ_IP: 127.0.0.1
      GZ_PARTITION: agentic_uav
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REBUILD_ON_START: ${REBUILD_ON_START:-1}
    volumes:
      - ./src:/ws/src:rw,z
      - agent-data:/data
    # e.g. AGENT_LAUNCH_ARGS="perception:=false reasoning:=false learning:=false"
    command: ros2 launch agentic_uav_bringup agent.launch.py ${AGENT_LAUNCH_ARGS:-}

volumes:
  agent-data:
