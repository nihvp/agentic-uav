services:
  agentic_uav:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: agentic-ai-uav:humble
    container_name: agentic_uav_container
    network_mode: host
    ipc: host
    shm_size: '2gb'
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ROS_DOMAIN_ID=0
      - QT_X11_NO_MITSHM=1
    volumes:
      # X11 Display Socket
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Direct Rendering Infrastructure (DRI / GPU Acceleration)
      - /dev/dri:/dev/dri:rw
      # Optional live code mounting for fast iteration
      - ./src:/ros2_ws/src:rw
    devices:
      - /dev/dri:/dev/dri
    privileged: true
    restart: "no"
    command: ros2 launch /ros2_ws/src/agentic_uav/launch/agentic_uav.launch.py
